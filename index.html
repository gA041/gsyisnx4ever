<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🐱想见你</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #ffe6f0 0%, #ffd9e8 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans', sans-serif;
            padding: 20px;
        }

        .card {
            max-width: 550px;
            width: 100%;
            background: rgba(255, 250, 252, 0.96);
            backdrop-filter: blur(2px);
            border-radius: 56px;
            box-shadow: 0 20px 35px rgba(255, 105, 150, 0.12), 0 0 0 1px rgba(255, 220, 235, 0.6);
            padding: 32px 24px 40px;
            text-align: center;
        }

        .cat-area {
            font-size: 78px;
            margin-bottom: 6px;
            filter: drop-shadow(0 6px 12px rgba(255, 120, 160, 0.2));
            animation: catWave 2.5s infinite ease-in-out;
        }

        @keyframes catWave {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .countdown-ring {
            background: #ffffffdd;
            border-radius: 200px;
            width: 190px;
            height: 190px;
            margin: 8px auto 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(255, 150, 180, 0.15), inset 0 0 0 1px #fff9fb;
        }

        .days-number {
            font-size: 74px;
            font-weight: 620;
            color: #f3a0b8;
            letter-spacing: 2px;
            line-height: 1;
        }

        .days-unit {
            font-size: 16px;
            color: #e0a1b5;
            font-weight: 470;
            margin-top: 6px;
        }

        .meet-date {
            font-size: 13px;
            background: #ffeef4;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 40px;
            color: #e8a0b5;
            font-weight: 470;
            margin-top: 10px;
        }

        /* 回忆库板块 - 放大了 */
        .memory-box {
            background: #fffbfd;
            border-radius: 48px;
            padding: 32px 28px;
            margin: 28px 0 20px;
            border: 1px solid #ffe0ec;
        }

        .memory-label {
            font-size: 20px;
            font-weight: 600;
            color: #f2a9c2;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .memory-text {
            font-size: 24px;
            font-weight: 500;
            line-height: 1.5;
            color: #a86f82;
            background: #fff9fb;
            padding: 18px 22px;
            border-radius: 60px;
        }

        .memory-emoji {
            font-size: 52px;
            margin-top: 18px;
        }

        .progress-area {
            margin: 8px 0 6px;
        }
        .progress-bg {
            background: #fae2ec;
            border-radius: 30px;
            height: 8px;
            width: 100%;
        }
        .progress-fill {
            width: 0%;
            background: #f8afcb;
            height: 8px;
            border-radius: 30px;
            transition: width 0.3s ease;
        }
        .progress-tip {
            font-size: 12px;
            color: #da9bb0;
            margin-top: 10px;
        }

        .footnote {
            background: #fff7fa;
            padding: 12px 18px;
            border-radius: 44px;
            font-size: 13px;
            color: #dd9bb0;
            margin-top: 20px;
            border: 1px solid #ffe0ec;
        }

        .footer {
            font-size: 11px;
            margin-top: 22px;
            color: #eab7ca;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="cat-area" id="catIcon"></div>

    <div class="countdown-ring">
        <div class="days-number" id="daysLeft">--</div>
        <div class="days-unit" id="daysUnit">天后见老婆</div>
        <div class="meet-date" id="meetDateLabel"></div>
    </div>

    <div class="memory-box">
        <div class="memory-label">
            <span>🐾</span>one kiss one love<span>💍</span>
        </div>
        <div class="memory-text" id="memoryText">
           memory
        </div>
        <div class="memory-emoji" id="memoryEmoji">
            🐈🐾
        </div>
    </div>

    <div class="progress-area">
        <div class="progress-bg">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-tip" id="progressInfo"></div>
    </div>

    <div class="footnote" id="footnoteMsg">
        🐱小宝宝 每天都好想你
    </div>
    <div class="footer">
        情人节卡片 手写的永远
    </div>
</div>

<script>
    // ✅ 见面日期：2026年6月15日（月份从0开始，5代表6月，15代表日期）
    const MEET_DATE = new Date(2026, 5, 15);
    
    // 回忆库：25天 → 0天（你的内容全部保留）
    const MEMORY_BY_DAYS = {
        25: { text: "地球online 评分：★★★★★ 感觉这个世界烂透了 但有一个人叫snx蛮可爱的 这五颗星都是为她打的！", emoji: "💓🐈"  },
        24: { text: "好喜欢你 知不知道", emoji: "🎧" },
        23: { text: "也许是天气 也许是运气 也许是因为有人不放弃", emoji: "📸🐾" },
        22: { text: "老婆喜欢的菜系 我已经在学了", emoji: "🧋" },
        21: { text: "和你视频的时候 像小猫跑来蹭屏幕 好想你耶", emoji: "🐈💕" },
        20: { text: "场景两个人一起散着步", emoji: "🌇🦋" },
        19: { text: "漂亮的让我面红的可爱女人", emoji: "🌙🐰" },
        18: { text: "宝宝睡觉的时候还有微笑唇 像小猫一样萌", emoji: "😴" },
        17: { text: "见我要穿什么想好了吗", emoji: "🐾" },
        16: { text: "买什么样的餐具呀老婆", emoji: "🍳✨" },
        15: { text: "倒计时15！已经在想要穿什么见我的小宝宝了", emoji: "🐱" },
        14: { text:  "相信爱一天 抵过永远", emoji: "💗" },
        13: { text: "你今天的心情怎么样 你有没有好好吃饭 每天发我们之间那些可爱的表情包好喜欢你呀", emoji: "🐾☕" },
        12: { text: "今日任务 去看看麦恩莉 的00:52秒", emoji: "💭" },
        11: { text: "收拾包包的时候想到宝宝广州把东西塞满我的包包的幸福", emoji: "🎒" },
        10: { text: "倒计时10！世界正中 邀请你听", emoji: "🎵" },
        9: { text:  "还记得上海见我是什么样的心情吗", emoji: "⭐✨" },
        8: { text: "不计划太多反而能勇敢冒险", emoji: "⭐" },
        7: { text: "看不见你的笑我怎么睡得着", emoji: "★" },
        6: { text: "有个女孩让我好想念", emoji: "🗣️💕" },
        5: { text: "宝宝！5天！！┈─┈Stay with me 4ever ┈─┈", emoji: "🏃‍♂️💨" },
        4: { text: "老婆 倒数4天啦 希望你觉得累的时候 觉得有我在是件不错的事好不好呀 这么久辛苦啦", emoji: "🐱" },
        3: { text: "三天啦 老婆考试辛苦啦 等待见面辛苦啦！期待三亚～ ", emoji: "★" },
        2: { text: "宝宝 后天见 记得亲亲我 抱抱", emoji: "★" },
        1: { text: "想好见面去做什么了吗老婆", emoji: "📩" },
        0: { text: "好幸福呀 马上还要收到会议记录哦", emoji: "🐱💕" }
    };

    function getDaysRemaining() {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(MEET_DATE);
        target.setHours(0, 0, 0, 0);
        const diffTime = target - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        return diffDays;
    }

    function getMemoryByDays(daysLeft) {
        if (daysLeft < 0) {
            return { text: "见面啦 和你在一起真的好幸福", emoji: "🐱" };
        }
        if (MEMORY_BY_DAYS[daysLeft]) {
            return MEMORY_BY_DAYS[daysLeft];
        }
        return { text: `还有${daysLeft}天 我爱你`, emoji: "🐱" };
    }

    function formatDate(date) {
        return `${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日`;
    }

    function getCatIcon(daysLeft) {
        if (daysLeft <= 0) return "snxigsy ";
        if (daysLeft <= 3) return "gsyisnx";
        if (daysLeft <= 7) return "🐱";
        return "";
    }

    function getDaysUnitText(daysLeft) {
        if (daysLeft <= 0) return "今天见老婆耶";
        if (daysLeft === 1) return "明天见宝宝";
        if (daysLeft <= 5) return `天后见欣欣`;
        return "天后见老婆";
    }

    function updatePage() {
        const daysLeft = getDaysRemaining();
        const totalPhase = 25;
        let progressPercent = 0;
        if (daysLeft >= totalPhase) progressPercent = 0;
        else if (daysLeft <= 0) progressPercent = 100;
        else progressPercent = ((totalPhase - daysLeft) / totalPhase) * 100;

        document.getElementById('daysLeft').innerText = daysLeft < 0 ? 0 : daysLeft;
        document.getElementById('daysUnit').innerText = getDaysUnitText(daysLeft);
        document.getElementById('meetDateLabel').innerHTML = ` ${formatDate(MEET_DATE)} 见面日🐱`;

        const memory = getMemoryByDays(daysLeft);
        document.getElementById('memoryText').innerText = memory.text;
        document.getElementById('memoryEmoji').innerHTML = memory.emoji;
        document.getElementById('catIcon').innerHTML = getCatIcon(daysLeft);
        document.getElementById('progressFill').style.width = `${Math.min(100, progressPercent)}%`;
        
        if (daysLeft <= 0) {
            document.getElementById('progressInfo').innerHTML = '进度100% ';
            document.getElementById('footnoteMsg').innerHTML = '🐱 老婆见面快乐！';
        } else if (daysLeft <= 3) {
            document.getElementById('progressInfo').innerHTML = `🐾 只剩${daysLeft}天啦老婆！好想好想你`;
            document.getElementById('footnoteMsg').innerHTML = '牵着你的手一直走到最后 这一刻怎么回头';
        } else {
            const unlocked = totalPhase - daysLeft;
            document.getElementById('progressInfo').innerHTML = `还有 ${daysLeft} 天见宝宝`;
            document.getElementById('footnoteMsg').innerHTML = 'gsyisnx';
        }
    }

    updatePage();
</script>
</body>
</html>
